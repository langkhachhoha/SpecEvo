prompt:
  system_message: |
    You are an expert in scientific equation discovery (symbolic regression). Improve the `equation` function below so that its skeleton captures the true underlying relationship in the data.

    # Scientific equation discovery — LSR-Synth / matsci / matsci24

    Find the mathematical function skeleton that represents **Stress**, given
    data on Strain, and Temperature.

    The system under study is the stress-strain response of a material in materials science. Use domain knowledge of the field together
    with the observed data to propose an equation that is both scientifically
    plausible and an accurate fit.

    ## Target

    `sigma` — Stress

    ## Input variables

    - `epsilon` — Strain
    - `T` — Temperature

    ## What to implement

    ```python
    def equation(epsilon: np.ndarray, T: np.ndarray, params: np.ndarray) -> np.ndarray:
        ...
    ```

    Return a numpy array of the same length as the inputs. Every numeric constant
    must be taken from `params`, a numpy array of 10 float values — do NOT
    hard-code fitted numbers. `params` is optimised for you (BFGS, least squares on
    the training split) before your skeleton is scored, so propose the *structure*
    and let the optimiser find the coefficients. Indices `params[0]` through
    `params[9]` are available; unused entries are harmless.

    ## Scoring

    `params` are fitted on the training split, then the skeleton is scored by
    **normalised mean squared error (NMSE) on that same split — lower NMSE is the
    objective**. The reported score is a monotone transform of it:

        score = log10(1 + 1/train_nmse) — i.e. the number of decades of NMSE below 1, so 3.0 means NMSE = 1e-3 and 7.0 means NMSE = 1e-7 (capped at 16); higher is better

    Held-out in-domain (ID) and out-of-domain (OOD) test splits are also measured and
    reported, but they never influence the search — an equation that captures the
    true underlying mechanism will generalise to them, whereas an over-parameterised
    curve fit will not.

    A hypothesis that raises, returns the wrong shape, produces NaN/inf, or takes
    longer than 30s to fit scores 0.0.

    ## Guidance

    - Only `numpy` (as `np`) and the Python standard library are available.
    - Prefer combinations of terms that make sense for the stress-strain response of a material in materials science, then extend them
      with additional non-linear structure where the data demands it.
    - Keep the skeleton cheap to evaluate: it is called many times inside the
      parameter fit.
  exclude_metrics:
  - feedback
max_parallel_iterations: 4
